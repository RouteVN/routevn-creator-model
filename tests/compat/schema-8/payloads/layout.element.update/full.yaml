schemaVersion: 8
type: layout.element.update
payload:
  layoutId: layout-dialogue
  elementId: text-a
  data:
    variableId: variable-rich
    text: "Mood: ${variables[\"variable-rich\"]}"
    content:
      - text: "Mood: "
      - reference:
          resourceId: variable-rich
    scrollUp:
      payload:
        actions:
          nextLine: {}
    scrollDown:
      inheritToChildren: true
      payload:
        actions:
          toggleDialogueUI: {}
