    payload:
      fileId: file-sound
      data:
        mimeType: audio/mp3
        size: 1024
        sha256: file-sound-sha256
    modelSchemaVersion: 16
  - type: file.create
    payload:
      fileId: waveform-sound
      data:
        mimeType: application/json
        size: 64
        sha256: waveform-sound-sha256
    modelSchemaVersion: 16
  - type: file.create
    payload:
      fileId: file-video
      data:
        mimeType: video/mp4
        size: 4096
        sha256: file-video-sha256
    modelSchemaVersion: 16
  - type: file.create
    payload:
      fileId: thumb-video
      data:
        mimeType: image/jpeg
        size: 128
        sha256: thumb-video-sha256
    modelSchemaVersion: 16
  - type: image.create
    payload:
      imageId: folder-art
      data:
        type: folder
        name: Art
    modelSchemaVersion: 16
  - type: image.create
    payload:
      imageId: image-a
      parentId: folder-art
      data:
        type: image
        name: Background
        fileId: file-image
        thumbnailFileId: thumb-image
        width: 1920
        height: 1080
    modelSchemaVersion: 16
  - type: image.update
    payload:
      imageId: image-a
      data:
        description: Establishing shot
    modelSchemaVersion: 16
  - type: image.move
    payload:
      imageId: image-a
      parentId: folder-art
      position: last
    modelSchemaVersion: 16
  - type: spritesheet.create
    payload:
      spritesheetId: folder-spritesheets
      data:
        type: folder
        name: Spritesheets
    modelSchemaVersion: 16
  - type: spritesheet.create
    payload:
      spritesheetId: spritesheet-a
      parentId: folder-spritesheets
      data:
        type: spritesheet
        name: Hero Idle
        fileId: file-spritesheet
        thumbnailFileId: thumb-spritesheet
        width: 256
        height: 256
        jsonData:
          frames:
            frame-0:
              frame:
                x: 0
                "y": 0
                w: 1
                h: 1
            frame-1:
              frame:
                x: 1
                "y": 0
                w: 1
                h: 1
          meta:
            image: hero-idle.png
        animations:
          idle:
            frames:
              - 0
              - 1
            animationSpeed: 1
            loop: true
    modelSchemaVersion: 16
  - type: spritesheet.update
    payload:
      spritesheetId: spritesheet-a
      data:
        description: Idle loop spritesheet
    modelSchemaVersion: 16
  - type: spritesheet.move
    payload:
      spritesheetId: spritesheet-a
      parentId: folder-spritesheets
      position: last
    modelSchemaVersion: 16
  - type: sound.create
    payload:
      soundId: folder-audio
      data:
        type: folder
        name: Audio
    modelSchemaVersion: 16
  - type: sound.create
    payload:
      soundId: sound-a
      parentId: folder-audio
      data:
        type: sound
        name: Ambience
        fileId: file-sound
        waveformDataFileId: waveform-sound
        duration: 42.5
    modelSchemaVersion: 16
  - type: sound.update
    payload:
      soundId: sound-a
      data:
        description: Night ambience
        waveformDataFileId: null
    modelSchemaVersion: 16
  - type: sound.move
    payload:
      soundId: sound-a
      parentId: folder-audio
      position: last
    modelSchemaVersion: 16
  - type: video.create
    payload:
      videoId: folder-video
      data:
        type: folder
        name: Video
    modelSchemaVersion: 16
  - type: video.create
    payload:
      videoId: video-a
      parentId: folder-video
      data:
        type: video
        name: Opening
        fileId: file-video
        thumbnailFileId: thumb-video
        width: 1280
        height: 720
    modelSchemaVersion: 16
  - type: video.update
    payload:
      videoId: video-a
      data:
        description: Opening cinematic
    modelSchemaVersion: 16
  - type: video.move
    payload:
      videoId: video-a
      parentId: folder-video
      position: last
    modelSchemaVersion: 16
  - type: image.delete
    payload:
      imageIds:
        - image-a
        - folder-art
    modelSchemaVersion: 16
  - type: spritesheet.delete
    payload:
      spritesheetIds:
        - spritesheet-a
        - folder-spritesheets
    modelSchemaVersion: 16
  - type: sound.delete
    payload:
      soundIds:
        - sound-a
        - folder-audio
    modelSchemaVersion: 16
  - type: video.delete
    payload:
      videoIds:
        - video-a
        - folder-video
    modelSchemaVersion: 16
  - type: file.delete
    payload:
      fileIds:
        - thumb-image
        - file-image
        - thumb-spritesheet
        - file-spritesheet
        - waveform-sound
        - file-sound
        - thumb-video
        - file-video
    modelSchemaVersion: 16
