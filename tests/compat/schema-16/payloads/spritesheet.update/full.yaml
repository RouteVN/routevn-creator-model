            x: 1
            "y": 0
            w: 1
            h: 1
        frame-2:
          frame:
            x: 2
            "y": 0
            w: 1
            h: 1
        frame-3:
          frame:
            x: 3
            "y": 0
            w: 1
            h: 1
        frame-4:
          frame:
            x: 4
            "y": 0
            w: 1
            h: 1
        frame-5:
          frame:
            x: 5
            "y": 0
            w: 1
            h: 1
