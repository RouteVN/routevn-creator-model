  - type: file.create
    payload:
      fileId: thumb-animation
      data:
        mimeType: image/webp
        size: 128
        sha256: thumb-animation-sha256
  - type: animation.create
    payload:
      animationId: folder-motion
      data:
        type: folder
        name: Motion
  - type: animation.create
    payload:
      animationId: animation-a
      parentId: folder-motion
      data:
        type: animation
        name: Entrance
        thumbnailFileId: thumb-animation
        preview:
          background:
            imageId: image-background
          outgoing:
            imageId: image-outgoing
          incoming:
            imageId: image-incoming
        animation:
          type: update
          tween:
            x:
              auto:
                duration: 1000
                easing: linear
  - type: animation.update
    payload:
      animationId: animation-a
      data:
        description: Entrance motion
        preview:
          background:
            imageId: image-background
          outgoing:
            imageId: image-outgoing
            transformId: transform-outgoing
          incoming:
            imageId: image-incoming
            transformId: transform-incoming
        animation:
          type: update
          tween:
            x:
              auto:
                duration: 1200
                easing: easeOutQuad
            alpha:
              keyframes:
                - duration: 100
                  value: 1
  - type: animation.move
    payload:
      animationId: animation-a
      parentId: folder-motion
      position: last
  - type: animation.delete
    payload:
      animationIds:
        - animation-a
        - folder-motion
