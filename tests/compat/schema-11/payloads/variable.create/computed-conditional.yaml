schemaVersion: 11
type: variable.create
payload:
  variableId: status-badge
  data:
    type: variable
    variableType: object
    name: Status Badge
    computed:
      branches:
        - when:
            lte:
              - var: variables.score
              - 0
          value:
            text: Empty
            colorId: gray
      default:
        value:
          text: Ready
          colorId: green
