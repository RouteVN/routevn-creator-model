schemaVersion: 18
state:
  project: {}
  story:
    initialSceneId: scene-a
  tags:
    images:
      items: {}
      tree: []
    sounds:
      items: {}
      tree: []
    videos:
      items: {}
      tree: []
    characters:
      items: {}
      tree: []
    fonts:
      items: {}
      tree: []
    transforms:
      items: {}
      tree: []
    colors:
      items: {}
      tree: []
    textStyles:
      items: {}
      tree: []
    variables:
      items: {}
      tree: []
    layouts:
      items: {}
      tree: []
    controls:
      items: {}
      tree: []
    animations:
      items: {}
      tree: []
    audioEffects:
      items:
        smooth:
          id: smooth
          type: tag
          name: Smooth
          color: "#446688"
      tree:
        - id: smooth
    particles:
      items: {}
      tree: []
    spritesheets:
      items: {}
      tree: []
    assetPacks:
      items:
        tag-chapter:
          id: tag-chapter
          type: tag
          name: Chapter
          color: "#664422"
        tag-complete:
          id: tag-complete
          type: tag
          name: Complete
      tree:
        - id: tag-chapter
        - id: tag-complete
  scenes:
    items:
      scene-a:
        id: scene-a
        type: scene
        name: Intro
        sections:
          items:
            section-a:
              id: section-a
              name: Section A
              lines:
                items:
                  line-a:
                    id: line-a
                    actions:
                      say: hello
                      background:
                        resourceId: image-rich
                        opacity: 0.75
                        blur:
                          x: 6
                          "y": 9
                          quality: 3
                          kernelSize: 9
                          repeatEdgePixels: true
                  line-b:
                    id: line-b
                    actions:
                      say: bye
                tree:
                  - id: line-a
                    children: []
                  - id: line-b
                    children: []
            section-b:
              id: section-b
              name: Section B
              lines:
                items:
                  line-other:
                    id: line-other
                    actions:
                      say: other
                tree:
                  - id: line-other
                    children: []
          tree:
            - id: section-a
              children: []
            - id: section-b
              children: []
      folder-scenes:
        id: folder-scenes
        type: folder
        name: Folder
      scene-b:
        id: scene-b
        type: scene
        name: Middle
        sections:
          items:
            section-other:
              id: section-other
              name: Other
              lines:
                items: {}
                tree: []
          tree:
            - id: section-other
              children: []
    tree:
      - id: scene-a
        children: []
      - id: folder-scenes
        children:
          - id: scene-b
            children: []
  files:
    items:
      file-font-ui:
        id: file-font-ui
        type: font
        mimeType: font/ttf
        size: 1
        sha256: file-font-ui-sha256
      file-smile:
        id: file-smile
        type: image
        mimeType: image/png
        size: 256
        sha256: file-smile-sha256
      file-angry:
        id: file-angry
        type: image
        mimeType: image/png
        size: 256
        sha256: file-angry-sha256
      thumb-spritesheet-ui:
        id: thumb-spritesheet-ui
        type: image-thumbnail
        mimeType: image/webp
        size: 128
        sha256: thumb-spritesheet-ui-sha256
      file-image-rich:
        id: file-image-rich
        type: image
        mimeType: image/png
        size: 2048
        sha256: file-image-rich-sha256
      thumb-image-rich:
        id: thumb-image-rich
        type: image-thumbnail
        mimeType: image/webp
        size: 1
        sha256: thumb-image-rich-sha256
      file-spritesheet-rich:
        id: file-spritesheet-rich
        type: image
        mimeType: image/png
        size: 3072
        sha256: file-spritesheet-rich-sha256
      thumb-spritesheet-rich:
        id: thumb-spritesheet-rich
        type: image-thumbnail
        mimeType: image/webp
        size: 128
        sha256: thumb-spritesheet-rich-sha256
      thumb-animation-rich:
        id: thumb-animation-rich
        type: image-thumbnail
        mimeType: image/webp
        size: 128
        sha256: thumb-animation-rich-sha256
      file-sound-rich:
        id: file-sound-rich
        type: audio
        mimeType: audio/mp3
        size: 1024
        sha256: file-sound-rich-sha256
      waveform-sound-rich:
        id: waveform-sound-rich
        type: audio-waveform
        mimeType: application/json
        size: 1
        sha256: waveform-sound-rich-sha256
      file-video-rich:
        id: file-video-rich
        type: video
        mimeType: video/mp4
        size: 4096
        sha256: file-video-rich-sha256
      thumb-video-rich:
        id: thumb-video-rich
        type: video-thumbnail
        mimeType: image/jpeg
        size: 1
        sha256: thumb-video-rich-sha256
    tree:
      - id: file-font-ui
        children: []
      - id: file-smile
        children: []
      - id: file-angry
        children: []
      - id: thumb-spritesheet-ui
        children: []
      - id: file-image-rich
        children: []
      - id: thumb-image-rich
        children: []
      - id: file-spritesheet-rich
        children: []
      - id: thumb-spritesheet-rich
        children: []
      - id: thumb-animation-rich
        children: []
      - id: file-sound-rich
        children: []
      - id: waveform-sound-rich
        children: []
      - id: file-video-rich
        children: []
      - id: thumb-video-rich
        children: []
  images:
    items:
      folder-art:
        id: folder-art
        type: folder
        name: Art
      image-rich:
        id: image-rich
        type: image
        name: Background
        description: Establishing shot
        fileId: file-image-rich
        thumbnailFileId: thumb-image-rich
        width: 1920
        height: 1080
      folder-pack-images:
        id: folder-pack-images
        type: folder
        name: Pack images
      folder-pack-images-nested:
        id: folder-pack-images-nested
        type: folder
        name: Pack images nested
    tree:
      - id: folder-art
        children:
          - id: image-rich
            children: []
      - id: folder-pack-images
        children:
          - id: folder-pack-images-nested
            children: []
  spritesheets:
    items:
      folder-spritesheets:
        id: folder-spritesheets
        type: folder
        name: Spritesheets
      spritesheet-rich:
        id: spritesheet-rich
        type: spritesheet
        name: Hero Idle
        description: Idle loop spritesheet
        fileId: file-spritesheet-rich
        thumbnailFileId: thumb-spritesheet-rich
        sheetWidth: 1024
        sheetHeight: 512
        frameCount: 4
        width: 256
        height: 256
        jsonData:
          meta:
            image: hero-idle.png
        animations:
          idle:
            frames:
              - 0
              - 1
              - 2
              - 3
            animationSpeed: 1
            loop: true
      folder-pack-spritesheets:
        id: folder-pack-spritesheets
        type: folder
        name: Pack spritesheets
      folder-pack-spritesheets-nested:
        id: folder-pack-spritesheets-nested
        type: folder
        name: Pack spritesheets nested
    tree:
      - id: folder-spritesheets
        children:
          - id: spritesheet-rich
            children: []
      - id: folder-pack-spritesheets
        children:
          - id: folder-pack-spritesheets-nested
            children: []
  sounds:
    items:
      folder-audio:
        id: folder-audio
        type: folder
        name: Audio
      sound-rich:
        id: sound-rich
        type: sound
        name: Ambience
        description: Night ambience
        fileId: file-sound-rich
        waveformDataFileId: waveform-sound-rich
        duration: 42.5
      folder-pack-sounds:
        id: folder-pack-sounds
        type: folder
        name: Pack sounds
      folder-pack-sounds-nested:
        id: folder-pack-sounds-nested
        type: folder
        name: Pack sounds nested
    tree:
      - id: folder-audio
        children:
          - id: sound-rich
            children: []
      - id: folder-pack-sounds
        children:
          - id: folder-pack-sounds-nested
            children: []
  voices:
    items: {}
    tree: []
  videos:
    items:
      folder-video:
        id: folder-video
        type: folder
        name: Video
      video-rich:
        id: video-rich
        type: video
        name: Opening
        description: Opening cinematic
        fileId: file-video-rich
        thumbnailFileId: thumb-video-rich
        width: 1280
        height: 720
      folder-pack-videos:
        id: folder-pack-videos
        type: folder
        name: Pack videos
      folder-pack-videos-nested:
        id: folder-pack-videos-nested
        type: folder
        name: Pack videos nested
    tree:
      - id: folder-video
        children:
          - id: video-rich
            children: []
      - id: folder-pack-videos
        children:
          - id: folder-pack-videos-nested
            children: []
  animations:
    items:
      animation-rich:
        id: animation-rich
        type: animation
        name: Entrance Motion
        description: Entrance motion
        thumbnailFileId: thumb-animation-rich
        preview:
          background:
            imageId: image-rich
          outgoing:
            imageId: image-rich
          incoming:
            imageId: image-rich
        animation:
          type: update
          tween:
            x:
              auto:
                duration: 1000
                easing: linear
            alpha:
              keyframes:
                - duration: 100
                  delay: 25
                  value: 1
      folder-pack-animations:
        id: folder-pack-animations
        type: folder
        name: Pack animations
      folder-pack-animations-nested:
        id: folder-pack-animations-nested
        type: folder
        name: Pack animations nested
    tree:
      - id: animation-rich
        children: []
      - id: folder-pack-animations
        children:
          - id: folder-pack-animations-nested
            children: []
  audioEffects:
    items:
      folder-audio-effects:
        id: folder-audio-effects
        type: folder
        name: Audio Effects
      crossfade:
        id: crossfade
        type: audioEffect
        name: Crossfade
        description: Fade between two BGM sources
        tagIds:
          - smooth
        preview:
          outgoing:
            soundId: sound-rich
          incoming:
            soundId: sound-rich
        audioEffect:
          type: transition
          prev:
            volume:
              initialValue: 100
              keyframes:
                - value: 40
                  duration: 200
                  easing: easeOutSine
                - value: 0
                  duration: 400
                  easing: easeInOutSine
          next:
            volume:
              initialValue: 0
              keyframes:
                - value: 60
                  duration: 300
                  easing: easeOutSine
                - value: 100
                  duration: 600
                  easing: easeInOutSine
      smooth-volume:
        id: smooth-volume
        type: audioEffect
        name: Smooth Volume Change
        tagIds:
          - smooth
        audioEffect:
          type: update
          tween:
            volume:
              initialValue: 90
              keyframes:
                - startValue: 80
                  value: 50
                  duration: 150
                  easing: easeOutQuad
                - value: 30
                  duration: 350
                  easing: easeInOutSine
      folder-pack-audioEffects:
        id: folder-pack-audioEffects
        type: folder
        name: Pack audioEffects
      folder-pack-audioEffects-nested:
        id: folder-pack-audioEffects-nested
        type: folder
        name: Pack audioEffects nested
    tree:
      - id: folder-audio-effects
        children:
          - id: crossfade
            children: []
          - id: smooth-volume
            children: []
      - id: folder-pack-audioEffects
        children:
          - id: folder-pack-audioEffects-nested
            children: []
  particles:
    items:
      folder-pack-particles:
        id: folder-pack-particles
        type: folder
        name: Pack particles
      folder-pack-particles-nested:
        id: folder-pack-particles-nested
        type: folder
        name: Pack particles nested
    tree:
      - id: folder-pack-particles
        children:
          - id: folder-pack-particles-nested
            children: []
  characters:
    items:
      character-hero:
        id: character-hero
        type: character
        name: Hero
        sprites:
          items:
            folder-default:
              id: folder-default
              type: folder
              name: Default
            sprite-a:
              id: sprite-a
              type: image
              name: Smile
              fileId: file-smile
            sprite-b:
              id: sprite-b
              type: image
              name: Angry
              fileId: file-angry
          tree:
            - id: folder-default
              children:
                - id: sprite-a
                  children: []
            - id: sprite-b
              children: []
      folder-pack-characters:
        id: folder-pack-characters
        type: folder
        name: Pack characters
      folder-pack-characters-nested:
        id: folder-pack-characters-nested
        type: folder
        name: Pack characters nested
    tree:
      - id: character-hero
        children: []
      - id: folder-pack-characters
        children:
          - id: folder-pack-characters-nested
            children: []
  fonts:
    items:
      font-ui:
        id: font-ui
        type: font
        name: UI Font
        fileId: file-font-ui
        fontFamily: Suit
        minWeight: 100
        defaultWeight: 400
        maxWeight: 900
      folder-pack-fonts:
        id: folder-pack-fonts
        type: folder
        name: Pack fonts
      folder-pack-fonts-nested:
        id: folder-pack-fonts-nested
        type: folder
        name: Pack fonts nested
    tree:
      - id: font-ui
        children: []
      - id: folder-pack-fonts
        children:
          - id: folder-pack-fonts-nested
            children: []
  transforms:
    items:
      transform-rich:
        id: transform-rich
        type: transform
        name: Camera
        description: Default framing transform
        x: 100
        "y": 200
        scaleX: 1
        scaleY: 1
        anchorX: 0
        anchorY: 0
        rotation: 0
      folder-pack-transforms:
        id: folder-pack-transforms
        type: folder
        name: Pack transforms
      folder-pack-transforms-nested:
        id: folder-pack-transforms-nested
        type: folder
        name: Pack transforms nested
    tree:
      - id: transform-rich
        children: []
      - id: folder-pack-transforms
        children:
          - id: folder-pack-transforms-nested
            children: []
  colors:
    items:
      color-ui:
        id: color-ui
        type: color
        name: White
        hex: "#ffffff"
      folder-pack-colors:
        id: folder-pack-colors
        type: folder
        name: Pack colors
      folder-pack-colors-nested:
        id: folder-pack-colors-nested
        type: folder
        name: Pack colors nested
    tree:
      - id: color-ui
        children: []
      - id: folder-pack-colors
        children:
          - id: folder-pack-colors-nested
            children: []
  textStyles:
    items:
      text-style-ui:
        id: text-style-ui
        type: textStyle
        name: UI Style
        fontId:
          - font-ui
        colorId: color-ui
        fontSize: 32
        lineHeight: 1.4
        fontWeight: "700"
        shadow:
          colorId: color-ui
          alpha: 0.75
          blur: 4
          offsetX: 2
          offsetY: 3
      folder-pack-textStyles:
        id: folder-pack-textStyles
        type: folder
        name: Pack textStyles
      folder-pack-textStyles-nested:
        id: folder-pack-textStyles-nested
        type: folder
        name: Pack textStyles nested
    tree:
      - id: text-style-ui
        children: []
      - id: folder-pack-textStyles
        children:
          - id: folder-pack-textStyles-nested
            children: []
  variables:
    items:
      variable-rich:
        id: variable-rich
        type: variable
        variableType: string
        name: Mood
        description: Tracks the current dialogue mood
        scope: account
        isEnum: true
        enumValues:
          - calm
          - tense
        default: calm
        value: calm
      variable-rich-label:
        id: variable-rich-label
        type: variable
        variableType: string
        name: Mood Label
        description: Derived from the current dialogue mood
        computed:
          branches:
            - when:
                eq:
                  - var: variables["variable-rich"]
                  - tense
              expr: Tense
          default:
            expr:
              var: variables["variable-rich"]
          examples:
            - id: example-tense
              name: Tense
              input:
                variables:
                  variable-rich: tense
      folder-pack-variables:
        id: folder-pack-variables
        type: folder
        name: Pack variables
      folder-pack-variables-nested:
        id: folder-pack-variables-nested
        type: folder
        name: Pack variables nested
    tree:
      - id: variable-rich
        children: []
      - id: variable-rich-label
        children: []
      - id: folder-pack-variables
        children:
          - id: folder-pack-variables-nested
            children: []
  layouts:
    items:
      layout-dialogue:
        id: layout-dialogue
        type: layout
        name: Dialogue
        description: Main dialogue frame
        layoutType: dialogue-adv
        thumbnailFileId: thumb-spritesheet-ui
        preview:
          backgroundImageId: image-preview-layout
          runtime:
            autoMode: true
        elements:
          items:
            container-root:
              id: container-root
              type: container
              name: Root
              x: 0
              "y": 0
              width: 100
              height: 100
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              gapX: 16
              gapY: 12
              scrollUp:
                inheritToChildren: true
                payload:
                  actions:
                    nextLine: {}
              scrollDown:
                payload:
                  actions:
                    toggleDialogueUI: {}
            text-a:
              id: text-a
              type: text-revealing
              name: Title
              x: 0
              "y": 0
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              text: Hello
              textStyleId: text-style-ui
              revealSoundId: sound-rich
              revealSoundStopTiming: immediate
            text-b:
              id: text-b
              type: text
              name: Subtitle
              hidden: true
              x: 0
              "y": 20
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              text: World
              textStyleId: text-style-ui
            save-date:
              id: save-date
              type: text-ref-save-load-slot-date
              name: Save Date
              x: 0
              "y": 40
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              dateFormat: DD/MM/YYYY
              textStyleId: text-style-ui
            sprite-blur:
              id: sprite-blur
              type: sprite
              name: Blurred Sprite
              x: 0
              "y": 60
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              blur:
                x: 6
                "y": 9
                quality: 3
                kernelSize: 9
                repeatEdgePixels: true
            choice-single-item:
              id: choice-single-item
              type: container-ref-choice-single-item
              name: Choice Single Item
              x: 0
              "y": 0
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              direction: absolute
              choiceItemIndex: 0
              click:
                inheritToChildren: true
          tree:
            - id: container-root
              children:
                - id: text-a
                  children: []
                - id: text-b
                  children: []
                - id: save-date
                  children: []
                - id: sprite-blur
                  children: []
                - id: choice-single-item
                  children: []
      folder-pack-layouts:
        id: folder-pack-layouts
        type: folder
        name: Pack layouts
      folder-pack-layouts-nested:
        id: folder-pack-layouts-nested
        type: folder
        name: Pack layouts nested
    tree:
      - id: layout-dialogue
        children: []
      - id: folder-pack-layouts
        children:
          - id: folder-pack-layouts-nested
            children: []
  controls:
    items:
      control-default:
        id: control-default
        type: control
        name: Default Control
        description: Shared navigation control
        thumbnailFileId: thumb-spritesheet-ui
        preview:
          choice:
            items:
              - content: Continue
        keyboard:
          enter:
            payload:
              actions:
                nextLine: {}
        keyup:
          enter:
            payload:
              actions:
                toggleAutoMode: {}
        elements:
          items:
            container-root:
              id: container-root
              type: container
              name: Root
              x: 0
              "y": 0
              width: 100
              height: 100
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              gapX: 16
              gapY: 12
              scrollUp:
                payload:
                  actions:
                    nextLine: {}
              scrollDown:
                inheritToChildren: true
                payload:
                  actions:
                    toggleSkipMode: {}
            text-a:
              id: text-a
              type: text
              name: Title
              x: 0
              "y": 0
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              text: Hello
              textStyleId: text-style-ui
            text-b:
              id: text-b
              type: text
              name: Subtitle
              hidden: true
              x: 0
              "y": 20
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              text: World
              textStyleId: text-style-ui
            sprite-blur:
              id: sprite-blur
              type: sprite
              name: Blurred Sprite
              x: 0
              "y": 60
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              blur:
                x: 6
                "y": 9
                quality: 3
                kernelSize: 9
                repeatEdgePixels: true
            choice-single-item:
              id: choice-single-item
              type: container-ref-choice-single-item
              name: Choice Single Item
              x: 0
              "y": 0
              anchorX: 0
              anchorY: 0
              scaleX: 1
              scaleY: 1
              rotation: 0
              direction: absolute
              choiceItemIndex: 0
              click:
                inheritToChildren: true
          tree:
            - id: container-root
              children:
                - id: text-a
                  children: []
                - id: text-b
                  children: []
                - id: sprite-blur
                  children: []
                - id: choice-single-item
                  children: []
      folder-pack-controls:
        id: folder-pack-controls
        type: folder
        name: Pack controls
      folder-pack-controls-nested:
        id: folder-pack-controls-nested
        type: folder
        name: Pack controls nested
    tree:
      - id: control-default
        children: []
      - id: folder-pack-controls
        children:
          - id: folder-pack-controls-nested
            children: []
  assetPacks:
    items:
      folder-asset-packs:
        id: folder-asset-packs
        type: folder
        name: Asset Packs
      asset-pack-starter:
        id: asset-pack-starter
        type: assetPack
        name: Starter Pack
        description: Art and audio for the opening chapter
        tagIds:
          - tag-chapter
        resources:
          - resourceType: images
            folderIds:
              - folder-art
          - resourceType: sounds
            folderIds:
              - folder-audio
          - resourceType: videos
            folderIds:
              - folder-video
          - resourceType: spritesheets
            folderIds:
              - folder-spritesheets
          - resourceType: audioEffects
            folderIds:
              - folder-audio-effects
      asset-pack-empty:
        id: asset-pack-empty
        type: assetPack
        name: Empty Pack
        resources: []
      folder-asset-packs-nested:
        id: folder-asset-packs-nested
        type: folder
        name: Nested
        description: Packs for later chapters
      asset-pack-everything:
        id: asset-pack-everything
        type: assetPack
        name: Everything
        description: ""
        tagIds:
          - tag-complete
          - tag-chapter
        resources:
          - resourceType: images
            folderIds:
              - folder-pack-images-nested
              - folder-pack-images
          - resourceType: sounds
            folderIds:
              - folder-pack-sounds-nested
              - folder-pack-sounds
          - resourceType: videos
            folderIds:
              - folder-pack-videos-nested
              - folder-pack-videos
