  - type: tag.create
    payload:
      scopeKey: audioEffects
      tagId: tag-transition
      data:
        type: tag
        name: Transition
        color: "#336699"
  - type: audioEffect.create
    payload:
      audioEffectId: folder-audio-effects
      data:
        type: folder
        name: BGM Effects
  - type: audioEffect.create
    payload:
      audioEffectId: crossfade
      parentId: folder-audio-effects
      data:
        type: audioEffect
        name: Crossfade
        tagIds:
          - tag-transition
        audioEffect:
          type: transition
          prev:
            fade:
              duration: 600
          next:
            fade:
              duration: 900
  - type: audioEffect.update
    payload:
      audioEffectId: crossfade
      data:
        name: Smooth Update
        audioEffect:
          type: update
          tween:
            volume:
              keyframes:
                - value: target
                  duration: 500
                  easing: easeInOutSine
  - type: tag.delete
    payload:
      scopeKey: audioEffects
      tagIds:
        - tag-transition
  - type: audioEffect.move
    payload:
      audioEffectId: crossfade
      parentId: null
      position: first
  - type: audioEffect.delete
    payload:
      audioEffectIds:
        - crossfade
        - folder-audio-effects
