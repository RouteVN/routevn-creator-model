  - type: audioEffect.create
    payload:
      audioEffectId: initial-crossfade
      data:
        type: audioEffect
        name: Initial Crossfade
        audioEffect:
          type: transition
          prev:
            fade:
              initialValue: 100
              keyframes:
                - value: 0
                  duration: 400
          next:
            fade:
              initialValue: 0
              keyframes:
                - value: 100
                  duration: 600
  - type: audioEffect.create
    payload:
      audioEffectId: initial-update
      data:
        type: audioEffect
        name: Initial Update
        audioEffect:
          type: update
          tween:
            volume:
              initialValue: 100
              keyframes:
                - value: 75
                  duration: 100
  - type: audioEffect.update
    payload:
      audioEffectId: initial-update
      data:
        audioEffect:
          type: update
          tween:
            volume:
              initialValue: 90
              keyframes:
                - startValue: 75
                  value: 50
                  duration: 100
            pan:
              initialValue: -0.5
              keyframes:
