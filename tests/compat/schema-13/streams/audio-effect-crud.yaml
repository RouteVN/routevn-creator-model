  - type: tag.create
    payload:
      scopeKey: audioEffects
      tagId: smooth
      data:
        type: tag
        name: Smooth
  - type: audioEffect.create
    payload:
      audioEffectId: folder-audio-effects
      data:
        type: folder
        name: Audio Effects
  - type: audioEffect.create
    payload:
      audioEffectId: crossfade
      parentId: folder-audio-effects
      data:
        type: audioEffect
        name: Crossfade
        tagIds:
          - smooth
        preview:
          outgoing:
            soundId: sound-outgoing
          incoming:
            soundId: sound-incoming
        audioEffect:
          type: transition
          prev:
            fade:
              keyframes:
                - value: 40
                  duration: 200
                  easing: easeOutSine
                - value: 0
                  duration: 400
                  easing: easeInOutSine
          next:
            fade:
              keyframes:
                - value: 60
                  duration: 300
                  easing: easeOutSine
                - value: 100
                  duration: 600
                  easing: easeInOutSine
  - type: audioEffect.update
    payload:
      audioEffectId: crossfade
      data:
        name: Smooth Volume Change
        preview:
          target:
            soundId: sound-target
        audioEffect:
          type: update
          tween:
            volume:
              keyframes:
                - startValue: 80
                  value: 50
                  duration: 150
                  easing: easeOutQuad
                - value: 30
                  duration: 350
                  easing: easeInOutSine
  - type: audioEffect.move
    payload:
      audioEffectId: crossfade
      parentId: null
      position: first
  - type: audioEffect.move
    payload:
      audioEffectId: crossfade
      parentId: folder-audio-effects
      position: last
  - type: tag.delete
    payload:
      scopeKey: audioEffects
      tagIds:
        - smooth
  - type: audioEffect.delete
    payload:
      audioEffectIds:
        - folder-audio-effects
