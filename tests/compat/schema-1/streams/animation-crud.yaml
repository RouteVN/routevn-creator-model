  - type: animation.create
    payload:
      animationId: folder-motion
      data:
        type: folder
        name: Motion
  - type: animation.create
    payload:
      animationId: animation-a
      parentId: folder-motion
      data:
        type: animation
        name: Entrance
        animation:
          type: update
          tween:
            x:
              keyframes:
                - duration: 100
                  value: -120
  - type: animation.update
    payload:
      animationId: animation-a
      data:
        description: Entrance motion
  - type: animation.move
    payload:
      animationId: animation-a
      parentId: folder-motion
      position: last
  - type: animation.delete
    payload:
      animationIds:
        - animation-a
        - folder-motion
