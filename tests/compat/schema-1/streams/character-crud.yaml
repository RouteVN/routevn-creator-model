commands:
  - type: project.create
    payload:
      state:
        project: {}
        story:
          initialSceneId: null
        scenes:
          items: {}
          tree: []
        files:
          items: {}
          tree: []
        images:
          items: {}
          tree: []
        sounds:
          items: {}
          tree: []
        videos:
          items: {}
