schemaVersion: 14
type: animation.create
payload:
  animationId: camera-one
  data:
    type: animation
    name: Camera One
    cameraTracks:
      - update
    animation:
      type: update
      tween:
        x:
          initialValue: 640
          keyframes:
            - duration: 1000
              value: 640
              easing: linear
        "y":
          initialValue: 360
          keyframes:
            - duration: 1000
              value: 360
              easing: linear
        scaleX:
          initialValue: 1
          keyframes:
            - duration: 1000
              value: 1
              easing: linear
        scaleY:
          initialValue: 1
          keyframes:
            - duration: 1000
              value: 1
              easing: linear
