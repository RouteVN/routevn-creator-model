---
suite: validatePayload
exportName: validatePayload
---
case: assetPack.create rejects a resource type listed twice
in:
  - type: assetPack.create
    payload:
      assetPackId: pack-a
      data:
        type: assetPack
        name: Starter
        resources:
          - resourceType: images
            folderIds:
              - folder-cg
          - resourceType: images
            folderIds:
              - folder-bg
throws: payload.data.resources[1].resourceType must be unique within payload.data.resources
---
case: assetPack.update rejects a folder id listed twice
in:
  - type: assetPack.update
    payload:
      assetPackId: pack-a
      data:
        resources:
          - resourceType: images
            folderIds:
              - folder-cg
              - folder-cg
throws: payload.data.resources[0].folderIds[1] must be unique
---
case: assetPack.create rejects tag ids
in:
  - type: assetPack.create
    payload:
      assetPackId: pack-a
      data:
        type: assetPack
        name: Starter
        tagIds:
          - tag-a
        resources: []
throws: payload.data.tagIds is not allowed
