---
suite: validatePayload
exportName: validatePayload
---
case: assetPack.create rejects a resource type listed twice
in:
  - type: assetPack.create
    payload:
      assetPackId: pack-a
      data:
        type: assetPack
        name: Starter
        resources:
          - resourceType: images
            folderIds:
              - folder-cg
          - resourceType: images
            folderIds:
              - folder-bg
throws: payload.data.resources[1].resourceType must be unique within payload.data.resources
---
case: assetPack.update rejects resources
in:
  - type: assetPack.update
    payload:
      assetPackId: pack-a
      data:
        resources:
          - resourceType: images
            folderIds:
              - folder-cg
throws: payload.data.resources is not allowed
---
case: assetPack.resource.update rejects an empty folder list
in:
  - type: assetPack.resource.update
    payload:
      assetPackId: pack-a
      resourceType: images
      data:
        folderIds: []
throws: payload.data.folderIds must be a non-empty array
---
case: assetPack.resource.move rejects a move without a placement
in:
  - type: assetPack.resource.move
    payload:
      assetPackId: pack-a
      resourceType: images
throws: payload.index or payload.position is required
---
case: assetPack.resource.create rejects a position target without a position
in:
  - type: assetPack.resource.create
    payload:
      assetPackId: pack-a
      resourceType: layouts
      positionTargetResourceType: images
      data:
        folderIds:
          - folder-ui
throws: payload.positionTargetResourceType requires payload.position
